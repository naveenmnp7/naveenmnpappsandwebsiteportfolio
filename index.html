<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNP APPS — Premium Websites for Growing Businesses</title>
    <meta name="description" content="MNP APPS is a creative web development agency building premium, mobile-responsive websites for restaurants, solar companies, real estate, e-commerce and small businesses." />
    <meta name="theme-color" content="#03091a" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MNP APPS — Premium Websites for Growing Businesses" />
    <meta property="og:description" content="Premium websites. Modern designs. Affordable pricing." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Dark background immediately, so the page is never a blank white screen while loading */
      html, body { background: #03091a; color: #cbd5e1; margin: 0; font-family: system-ui, sans-serif; }
      #boot-msg { max-width: 560px; margin: 18vh auto 0; padding: 24px; line-height: 1.55; }
      #boot-msg b { color: #fff; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"ProfessionalService","name":"MNP APPS","description":"Creative web development agency","image":"/og-image.png"}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-msg" hidden></div>
    <noscript><p style="padding:24px">Please enable JavaScript to view this website.</p></noscript>
    <script>
      /* Shows a readable message instead of a blank screen if the site cannot start. */
      (function () {
        var box = document.getElementById("boot-msg");
        var errors = [];
        function show(html) { box.innerHTML = html; box.hidden = false; }
        window.addEventListener("error", function (e) { errors.push(e.message || "script error"); });
        window.addEventListener("unhandledrejection", function (e) { errors.push(String((e.reason && e.reason.message) || e.reason)); });

        // Raw source is being served (GitHub Pages is not using the "GitHub Actions" source).
        // Checked after parsing finishes, because the module script comes later in the page.
        document.addEventListener("DOMContentLoaded", function () {
          if (document.querySelector('script[src*="/src/main.tsx"]')) {
            show("<b>MNP APPS</b><br>This page is serving the unbuilt source code.<br><br>Site owner: open the GitHub repo, go to <b>Settings → Pages → Build and deployment → Source</b>, choose <b>GitHub Actions</b>, then re-run the <b>Deploy to GitHub Pages</b> workflow.");
          }
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0) {
            show("<b>MNP APPS</b><br>The website could not start. Please refresh with Ctrl+Shift+R (or clear the cache).<br><br><small>" + (errors[0] || "No error was reported — a file may have failed to load.") + "</small>");
          }
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
